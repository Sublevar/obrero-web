<article class="card">
  <div class="card__body">
    <h2 class="card__title">
      <a href="{{ page.permalink }}">{{ page.title }}</a>
    </h2>
    <p class="card__description">{{ page.description | default(value="Lorem ipsum dolor sit amet, consectetur adipiscing elit.") }}</p>
    {% if page.date %}
    <time class="card__date" datetime="{{ page.date }}">{{ page.date | date(format="%d %b %Y") }}</time>
    {% endif %}
  </div>
</article>
